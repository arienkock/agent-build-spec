[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-build"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
agent-build = "agent_build.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
